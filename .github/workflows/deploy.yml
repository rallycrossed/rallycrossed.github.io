name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Copy legacy pages into dist
        run: |
          cp -r about dist/ 2>/dev/null || true
          cp -r blog  dist/ 2>/dev/null || true
          cp feed.xml dist/ 2>/dev/null || true
          cp 404.html dist/ 2>/dev/null || true
          cp Privacy.html dist/ 2>/dev/null || true
          cp Terms.html   dist/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
